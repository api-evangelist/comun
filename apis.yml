aid: comun
name: Comun
description: 'Comun (Común) is a fintech company providing digital banking and money-transfer
  services designed for Latino immigrants in the United States. Through a bilingual (Spanish/English)
  mobile app, users open an FDIC-insured U.S. checking account with a valid national ID and no SSN
  required, get a Visa debit card, receive early direct deposit up to two days ahead of payday, and
  send international remittances to 17+ Latin American countries via the app or WhatsApp. Banking
  services are provided through Community Federal Savings Bank; remittance and P2P rails run on
  UniTeller and Cross River Bank. Comun is backed by Costanoa Ventures and Redpoint Ventures. This
  profile was added to the API Evangelist network from VC portfolio data; Comun operates as a
  consumer neobank and does not publish a public developer API surface.'
